[package]
name = "stellar-insured-lib"
version = "1.0.0"
authors = ["Stellar Insured Team"]
edition = "2021"
description = "Shared library for Stellar Insured smart contracts"
license = "MIT"
publish = false

[dependencies]
soroban-sdk = "20.0.0"

[dev-dependencies]
# `testutils` provides the test Env, ledger control and `Address::generate`
# used by the admin-transfer tests. Consumers of this crate pull it in through
# their own `std` feature, so it is only a dev dependency here.
soroban-sdk = { version = "20.0.0", features = ["testutils"] }

[lib]
name = "stellar_insured_lib"
path = "src/lib.rs"
crate-type = ["rlib"]